version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: placement-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: placement_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: placement-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysqldb
      MYSQL_DATABASE: placement_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    depends_on:
      - mysqldb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: placement-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:

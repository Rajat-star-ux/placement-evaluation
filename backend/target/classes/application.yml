server:
  port: 8080

spring:
  application:
    name: placement-eval-system
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:placementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: 9a6e8f1c4b7d0e3f5a2c9b8d7e6f4a3b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f
  expiration: 86400000 # 24 hours in ms

ai:
  llm:
    api-key: ${GEMINI_API_KEY:demo-key}
    model: gemini-1.5-flash
    enabled: false # Falls back to NLP evaluation engine if false or no key

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:placement_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
